name: screenshot_search_app
description: AI Screenshot Search (search your screenshots by the text inside them).
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5

  image_text_search: ^0.0.1

  permission_handler: ^11.3.0
  photo_manager: ^3.3.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  http: ^1.2.0
  shimmer: ^3.0.0

flutter:
  uses-material-design: true
