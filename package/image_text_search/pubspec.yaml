name: image_text_search
description:
  "A Flutter package to index images via on-device OCR and search through them
  by text content. Uses Google ML Kit for text recognition.
  Ideal for screenshot search apps, document finders, and any use case where
  images need to be searchable by the text inside them."
version: 0.0.1
homepage: https://github.com/dhairyathareja1/screenshot_search/tree/main/package/image_text_search
repository: https://github.com/dhairyathareja1/screenshot_search

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

